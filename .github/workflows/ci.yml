name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  GO_VERSION: "1.22"

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

  test-node:
    name: Test (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

  test-go:
    name: Test (go)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [stun, h2-probe, tcp-probe]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src-go/${{ matrix.module }}/go.sum

      - name: Run go test
        working-directory: src-go/${{ matrix.module }}
        run: go test ./...

  build-and-synth:
    name: Build & CDK Synth
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-node]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: CDK synth
        env:
          CDK_DEFAULT_ACCOUNT: "263318538229"
          CDK_DEFAULT_REGION: us-east-1
        run: npx cdk synth --quiet
